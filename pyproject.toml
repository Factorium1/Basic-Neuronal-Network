[project]
name = "basic-neuronal-network"
version = "0.1.0"
description = "Playground for practicing different neural network implementations"
readme = "README.md"
authors = [
    { name = "Nils Müller", email = "admin@factorium1.de" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportImplicitRelativeImport = false

[tool.ty.environment]
python = ".venv"
